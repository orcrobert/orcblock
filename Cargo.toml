[workspace]
resolver = "3"
members = [
    "app/src-tauri",
    "crates/orcblock-core",
    "crates/orcblock-cli",
    "crates/orcblock-ipc",
    "crates/orcblockd",
    "tools/agenthooks",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/orcrobert/orcblock"
authors = ["Robert Orban <robyorban@gmail.com>"]

[workspace.dependencies]
orcblock-core = { path = "crates/orcblock-core" }
orcblock-ipc = { path = "crates/orcblock-ipc" }

anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
idna = "1.1"
jiff = { version = "0.2.38", features = ["serde"] }
nix = { version = "0.31", features = ["fs", "signal", "time", "user"] }
proptest = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls"] }
ureq = "3.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
