[workspace]
resolver = "3"
members = [
    "crates/orcblock-core",
    "tools/agenthooks",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/orcrobert/orcblock"
authors = ["Robert Orban <robyorban@gmail.com>"]

[workspace.dependencies]
orcblock-core = { path = "crates/orcblock-core" }

idna = "1.1"
jiff = { version = "0.2.38", features = ["serde"] }
proptest = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
