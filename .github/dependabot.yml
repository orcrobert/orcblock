version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      tauri:
        patterns: ["tauri*"]
      tokio:
        patterns: ["tokio*"]
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      svelte:
        patterns: ["svelte", "@sveltejs/*", "svelte-check"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
