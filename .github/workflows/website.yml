name: website

# Builds the site on pull requests that touch it and deploys it to Cloudflare
# Pages from main. The site reuses the app's tokens, orc and icons, so those
# paths count as site changes too.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "app/src/lib/**"
      - "app/src-tauri/icons/**"
      - "app/package.json"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "app/src/lib/**"
      - "app/src-tauri/icons/**"
      - "app/package.json"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs npm install scripts, so it gets no secrets.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            app/package-lock.json
      # The app's components import its types; svelte-check resolves them.
      - run: npm ci --prefix app --ignore-scripts
      # No install scripts: nothing in the toolchain needs them, and a
      # compromised one could otherwise slip files into the deployed site.
      - run: npm ci --prefix website --ignore-scripts
      - run: npm --prefix website run check
      - run: npm --prefix website test
      - run: npm --prefix website run format:check
      - run: npm --prefix website run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: website/dist/
          if-no-files-found: error
          retention-days: 7

  # Holds the Cloudflare token and runs no repository code.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: website
      url: ${{ steps.deploy.outputs.deployment-url }}
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website
          path: dist
      - name: Project name
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'orcblock' }}
        run: |
          printf '%s' "$PROJECT" | grep -Eqx '[a-z0-9-]+' || { echo "::error::bad project name"; exit 1; }
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.145.0"
          command: pages deploy dist --project-name=${{ env.PROJECT }} --branch=main --commit-hash=${{ github.sha }}
