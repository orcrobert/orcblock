name: release

# Every merge to main releases the version in Cargo.toml, unless a tag for it
# already exists. Merges that do not bump the version stop after one check.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      new: ${{ steps.tag.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/release-version.sh
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Only a 404 means untagged; any other API error stops the run
          # rather than building a release for a tag that may exist.
          if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1); then
            echo "$tag is already released; bump the version to release again."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q 'HTTP 404'; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi

  # Runs every build script and npm install script, so it gets no write
  # token and no OIDC token; it also skips caches so a release builds clean.
  build:
    runs-on: macos-latest
    needs: version
    if: needs.version.outputs.new == 'true'
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
      - name: Versions agree
        run: sh scripts/release-version.sh "$TAG"
      - run: make tools
      - run: npm ci --prefix app
      - run: make check
      - run: make bundle-universal
      - name: Release files
        run: |
          mkdir dist
          cp target/universal-apple-darwin/release/bundle/dmg/OrcBlock.dmg dist/OrcBlock.dmg
          cp dist/OrcBlock.dmg "dist/OrcBlock_${TAG#v}_macos_universal.dmg"
          cp target/universal-apple-darwin/release/bundle/macos/OrcBlock.app.tar.gz dist/
          (cd dist && shasum -a 256 -- *.dmg OrcBlock.app.tar.gz > SHA256SUMS)
          # Only for the publish job to check its signature against what
          # the app trusts; never published.
          jq -r .plugins.updater.pubkey app/src-tauri/tauri.conf.json | base64 -d > dist/updater.pub
          cp .github/release-notes.md dist/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Holds the write and attestation permissions and runs no repository code.
  publish:
    runs-on: ubuntu-latest
    needs: [version, build]
    # Deployment branches for this environment are limited to main in the
    # repository settings, so a branch cannot publish by editing this file.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Checksums still match
        run: cd dist && sha256sum --check SHA256SUMS
      # The key lives only in the release environment and reaches no job
      # that runs repository code. The trusted comment carries the version,
      # which the app requires (requireSignedVersion), so a tampered
      # latest.json cannot pair a new version with an older bundle.
      - name: Sign the update
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$KEY" ] || { echo "TAURI_SIGNING_PRIVATE_KEY is not set in the release environment" >&2; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          version=${TAG#v}
          key="$RUNNER_TEMP/updater.key"
          (umask 077 && printf '%s' "$KEY" | base64 -d > "$key")
          comment=$(printf 'timestamp:%s\tfile:OrcBlock.app.tar.gz\tversion:%s' "$(date +%s)" "$version")
          printf '%s\n' "$PASSWORD" | minisign -S -s "$key" -m dist/OrcBlock.app.tar.gz -x "$RUNNER_TEMP/update.minisig" -t "$comment"
          rm -f "$key"
          minisign -V -p dist/updater.pub -m dist/OrcBlock.app.tar.gz -x "$RUNNER_TEMP/update.minisig"
          base64 -w0 "$RUNNER_TEMP/update.minisig" > dist/OrcBlock.app.tar.gz.sig
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/OrcBlock.app.tar.gz"
          jq -n --arg version "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg url "$url" \
            --rawfile signature dist/OrcBlock.app.tar.gz.sig \
            '{version: $version, pub_date: $date, platforms: {
              "darwin-aarch64": {url: $url, signature: $signature},
              "darwin-x86_64": {url: $url, signature: $signature}}}' > dist/latest.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/OrcBlock.app.tar.gz
      # gh release create ignores --target when the tag exists, so a tag
      # pushed since the version check would get this build attached.
      - name: Tag still free
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>&1); then
            echo "$TAG appeared after the version check; not releasing over it." >&2
            exit 1
          elif ! printf '%s' "$out" | grep -q 'HTTP 404'; then
            echo "$out" >&2
            exit 1
          fi
      # Creates the tag on the commit that was built. A version such as
      # 1.0.0-beta.1 is a pre-release, which latest/download never serves.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel=--latest
          case "$TAG" in *-*) channel=--prerelease ;; esac
          gh release create "$TAG" dist/OrcBlock.dmg "dist/OrcBlock_${TAG#v}_macos_universal.dmg" dist/SHA256SUMS \
            dist/OrcBlock.app.tar.gz dist/OrcBlock.app.tar.gz.sig dist/latest.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "$channel" --title "OrcBlock $TAG" \
            --notes-file dist/release-notes.md --generate-notes
