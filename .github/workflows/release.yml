name: release

# Every merge to main releases the version in Cargo.toml, unless a tag for it
# already exists. Merges that do not bump the version stop after one check.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      new: ${{ steps.tag.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/release-version.sh
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Only a 404 means untagged; any other API error stops the run
          # rather than building a release for a tag that may exist.
          if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1); then
            echo "$tag is already released; bump the version to release again."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q 'HTTP 404'; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi

  # Runs every build script and npm install script, so it gets no write
  # token and no OIDC token; it also skips caches so a release builds clean.
  build:
    runs-on: macos-latest
    needs: version
    if: needs.version.outputs.new == 'true'
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
      - name: Versions agree
        run: sh scripts/release-version.sh "$TAG"
      - run: make tools
      - run: npm ci --prefix app
      - run: make check
      - run: make bundle-universal
      - name: Release files
        run: |
          mkdir dist
          cp target/universal-apple-darwin/release/bundle/dmg/OrcBlock.dmg dist/OrcBlock.dmg
          cp dist/OrcBlock.dmg "dist/OrcBlock_${TAG#v}_macos_universal.dmg"
          (cd dist && shasum -a 256 -- *.dmg > SHA256SUMS)
          cp .github/release-notes.md dist/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The Windows installer, under the same rules as build: no write token, no
  # caches. Its checksums travel separately and publish merges them.
  build-windows:
    runs-on: windows-latest
    needs: version
    if: needs.version.outputs.new == 'true'
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
      - name: Versions agree
        run: sh scripts/release-version.sh "$TAG"
      - run: npm ci --prefix app
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # agenthooks are the repo's Claude Code hooks, written for Unix paths
      # and tested by the macOS job; they do not ship (spec 0003, Follow-ups).
      - run: cargo test --workspace --exclude agenthooks --locked --no-fail-fast
      - run: sh scripts/bundle-windows.sh
      - name: Release files
        run: |
          mkdir dist
          cp target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe dist/OrcBlock-setup.exe
          cp dist/OrcBlock-setup.exe "dist/OrcBlock_${TAG#v}_windows_x64-setup.exe"
          (cd dist && sha256sum -- *.exe > SHA256SUMS-windows)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Holds the write and attestation permissions and runs no repository code.
  publish:
    runs-on: ubuntu-latest
    needs: [version, build, build-windows]
    # Deployment branches for this environment are limited to main in the
    # repository settings, so a branch cannot publish by editing this file.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows
          path: dist-windows
      - name: Checksums still match
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          (cd dist-windows && sha256sum --check SHA256SUMS-windows)
          mv dist-windows/*.exe dist/
          cat dist-windows/SHA256SUMS-windows >> dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.exe
      # gh release create ignores --target when the tag exists, so a tag
      # pushed since the version check would get this build attached.
      - name: Tag still free
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>&1); then
            echo "$TAG appeared after the version check; not releasing over it." >&2
            exit 1
          elif ! printf '%s' "$out" | grep -q 'HTTP 404'; then
            echo "$out" >&2
            exit 1
          fi
      # Creates the tag on the commit that was built. A version such as
      # 1.0.0-beta.1 is a pre-release, which latest/download never serves.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel=--latest
          case "$TAG" in *-*) channel=--prerelease ;; esac
          gh release create "$TAG" dist/OrcBlock.dmg "dist/OrcBlock_${TAG#v}_macos_universal.dmg" \
            dist/OrcBlock-setup.exe "dist/OrcBlock_${TAG#v}_windows_x64-setup.exe" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "$channel" --title "OrcBlock $TAG" \
            --notes-file dist/release-notes.md --generate-notes
