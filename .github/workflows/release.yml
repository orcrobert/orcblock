name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs every build script and npm install script, so it gets no write
  # token and no OIDC token; it also skips caches so a release builds clean.
  build:
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
      - name: Tag matches the version
        run: sh scripts/release-version.sh "$TAG"
      - run: make tools
      - run: npm ci --prefix app
      - run: make check
      - run: make bundle-universal
      - name: Release files
        run: |
          mkdir dist
          cp target/universal-apple-darwin/release/bundle/dmg/OrcBlock.dmg dist/OrcBlock.dmg
          cp dist/OrcBlock.dmg "dist/OrcBlock_${TAG#v}_macos_universal.dmg"
          (cd dist && shasum -a 256 -- *.dmg > SHA256SUMS)
          cp .github/release-notes.md dist/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Holds the write and attestation permissions and runs no repository code.
  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Checksums still match
        run: cd dist && sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.dmg
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" dist/OrcBlock.dmg "dist/OrcBlock_${TAG#v}_macos_universal.dmg" dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "OrcBlock $TAG"
          --notes-file dist/release-notes.md --generate-notes
