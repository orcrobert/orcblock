name: ci

# Pull requests only: a pull_request run already tests the merge result,
# so a push to main would only repeat it. Require branches to be up to date
# before merging so that result is what lands.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Node steps apply once the app exists; until then the gate is Rust only.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('app/package-lock.json') != ''
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make tools
      - run: npm ci --prefix app
        if: hashFiles('app/package-lock.json') != ''
      - run: make check

  bundle:
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nothing to bundle until the app exists.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('app/package-lock.json') != ''
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: hashFiles('app/package-lock.json') != ''
      - run: npm ci --prefix app
        if: hashFiles('app/package-lock.json') != ''
      - run: make bundle-universal
        if: hashFiles('app/package-lock.json') != ''
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: hashFiles('app/package-lock.json') != ''
        with:
          name: orcblock-macos-${{ github.sha }}
          path: target/universal-apple-darwin/release/bundle/dmg/OrcBlock.dmg
          retention-days: 7

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commit headers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! sh scripts/hooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::commit $sha has a bad header"
              status=1
            fi
          done
          exit $status
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          sh scripts/hooks/commit-msg "$RUNNER_TEMP/title"
